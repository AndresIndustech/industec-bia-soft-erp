<!doctype html>
<html lang="es-EC">
<head>
<meta charset="utf-8">
<title>Imagen para redes de INDUSTEC (1200 × 630)</title>
<!-- Fuente de sitio/assets/img/og-industec-cadenas-v4.jpg (la escribe herramientas/generar_og.py). Se captura con
     Edge sin ventana (LEEME, sección 9) y se convierte a JPEG sin metadatos. Textos: contenido.md, sección 9.1.
     La tarjeta lleva la ilustración de la portada (sitio/assets/img/ilus/portada-cocina-cadena.svg, estilo In Tune, T2.17.1): 468 × 352,
     4:3 como ella, con el mismo filo interior de 1 px. -->
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { font-family: "Segoe UI", system-ui, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.lienzo {
  position: relative; display: flex; align-items: center; gap: 46px;
  width: 1200px; height: 630px; padding: 0 58px 0 84px; box-sizing: border-box;
  background: linear-gradient(180deg, #F2F4F9 0%, #FFFFFF 100%);
}
.lienzo::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: #CC504B; }
.texto { flex: 1 1 0; }
.texto > img { display: block; width: 350px; margin-bottom: 34px; }
.etiqueta { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; color: #B5413C; font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.etiqueta::before { content: ""; width: 26px; height: 4px; border-radius: 2px; background: #CC504B; }
h1 { margin: 0 0 22px; color: #1E2438; font-size: 42px; font-weight: 800; line-height: 1.13; letter-spacing: -.01em; text-wrap: balance; }
.sub { margin: 0; color: #48537E; font-size: 23px; font-weight: 700; }
.tarjeta { position: relative; flex: 0 0 468px; border-radius: 22px; box-shadow: 0 1px 2px rgba(30, 36, 56, .06), 0 16px 36px rgba(30, 36, 56, .16); }
.tarjeta::before {
  content: ""; position: absolute; z-index: 0; top: -22px; right: -22px; width: 55%; height: 60%; border-radius: 22px;
  background-image: radial-gradient(rgba(72, 83, 126, .30) 1.6px, transparent 1.8px); background-size: 15px 15px;
}
.foto { position: relative; z-index: 1; border-radius: 22px 22px 0 0; overflow: hidden; background: #FBE9C8; }
.foto::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(72, 83, 126, .16); }
.foto img { display: block; width: 468px; height: 352px; object-fit: cover; }
ul { position: relative; z-index: 1; margin: 0; padding: 6px 22px; list-style: none; background: #1E2438; border-top: 4px solid #CC504B; border-radius: 0 0 22px 22px; }
li { display: flex; align-items: center; gap: 14px; padding: 10px 0; color: #fff; font-size: 20px; font-weight: 700; }
li + li { border-top: 1px solid rgba(255, 255, 255, .14); }
.ic { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 10px; background: #B5413C; }
.ic svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<div class="lienzo">
  <div class="texto">
    <img src="../../sitio/assets/img/logo-industec.png" alt="">
    <p class="etiqueta">Proveedor técnico para empresas</p>
    <h1>Mantenimiento de cocinas profesionales para cadenas de restaurantes y hoteles</h1>
    <p class="sub">Contrato de servicio · Emergencias 24/7</p>
  </div>
  <div class="tarjeta">
    <div class="foto"><img src="../../sitio/assets/img/ilus/portada-cocina-cadena.svg" alt=""></div>
    <ul>
      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13.5V5a2 2 0 0 1 4 0v8.5a4 4 0 1 1-4 0z"/><path d="M11 9.5v7"/><path d="M16.5 5.5h3M16.5 9h3M16.5 12.5h2"/></svg></span>Línea caliente, línea fría y ventilación</li>
      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5 3.5 4h17L22 9.5"/><path d="M2 9.5a3.33 1.9 0 0 0 6.67 0a3.33 1.9 0 0 0 6.66 0a3.33 1.9 0 0 0 6.67 0"/><path d="M8.67 9.5 9 4M15.33 9.5 15 4"/><path d="M3.5 11.8V20.5h17v-8.7"/><path d="M4.6 20.5V16h3v4.5M10.5 20.5V16h3v4.5M16.4 20.5V16h3v4.5"/></svg></span>Servicio para cadenas de restaurantes</li>
    </ul>
  </div>
</div>
</body>
</html>
