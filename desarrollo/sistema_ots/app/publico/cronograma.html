<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Preventivos · B.IA Soft ERP</title>
<link rel="stylesheet" href="estilo.css" />
<link rel="stylesheet" href="cronograma.css" />
</head>
<body>

<!-- La barra de la aplicación.
     Esta pantalla es HTML estático —la sirve el trabajador de servicio para que
     funcione sin señal— así que no puede llamar a `Ui::cabecera()` como las
     demás. La barra va con las mismas clases, y los módulos, el nombre y el
     rol los rellena `cronograma.js` con lo que devuelve el servidor
     (`Ui::modulos()`, TR-12): los mismos que ve en cualquier otra pantalla.
     Lo escrito aquí es solo lo que se ve mientras carga. -->
<header class="app-barra">
  <div class="app-barra-fila">
    <a class="app-marca" href="panel.php"><span class="punto"></span>B.IA <span class="fino">Soft ERP</span></a>
    <span class="app-espacio"></span>
    <div class="app-yo">
      <span class="nom" id="barraNombre"></span>
      <span class="chip" id="barraRol" hidden></span>
      <span class="chip" id="barraAlcance"></span>
      <a class="btn sm" href="salir.php">Salir</a>
    </div>
  </div>
  <nav class="app-nav" aria-label="Módulos">
    <div class="app-nav-fila" id="barraNav">
      <a href="panel.php">Inicio</a>
      <a href="cronograma.html" class="on" aria-current="page">Preventivos</a>
    </div>
  </nav>
</header>

<!-- La franja de alertas. Fija arriba, sin botón de cerrar: desaparece sola
     cuando la condición se resuelve, no cuando alguien la descarta. Lo pidió
     así el cliente — visible siempre, sin estorbar.

     DESDE EL 2026-09-21 LLEVA UNA SOLA FRASE. Antes traía hasta cinco chips de
     colores que repetían, uno por uno, lo mismo que decían las ocho tarjetas de
     abajo y la leyenda de siete colores. Andrés lo dijo con todas sus letras:
     «muy aturdidora, agolpa tanta información». Una alerta que aparece en cada
     carga y que dice cinco cosas a la vez no es una alerta: es papel tapiz. -->
<div class="alertas" id="alertas" hidden></div>

<div class="wrap">
  <div class="card">
    <div class="cab">
      <div>
        <h1>Preventivos</h1>
        <p class="sub" id="subcab">4 ingresos al año por local, acordados con Grupo KFC</p>
      </div>
      <!-- El desplegable es un FILTRO de verdad, no un simulador de rol: lo
           rellena `cronograma.js` con lo que el servidor dice que este usuario
           alcanza. A la administración, las tres zonas y cada una por separado;
           a un jefe de zona, la suya y nada más. -->
      <div class="cab-controles">
        <label class="oculto-visual" for="usuario">Zona que se muestra</label>
        <select id="usuario"></select>
        <button type="button" class="btn primary" id="btnAgendar">+ Agendar un local</button>
      </div>
    </div>

    <!-- El titular: UNA frase con lo que hay que hacer hoy. Reemplaza a las
         ocho tarjetas de cifras, que con los datos reales mostraban tres ceros
         permanentes (cumplidos, reagendados y «0 % a tiempo») y hacían leer
         veintiséis números para no sacar ninguna conclusión. -->
    <p class="titular" id="titular"></p>

    <!-- Tres horizontes, y uno solo a la vez. Es como trabajan los sistemas de
         mantenimiento: el mes sirve para ver dónde se amontona el trabajo, la
         semana es donde se decide de verdad, y el año es lo que se le reporta
         al cliente. Antes los tres estaban apilados en la misma pantalla. -->
    <div class="vistas" role="tablist" aria-label="Qué se muestra">
      <button type="button" role="tab" id="tabAhora" data-v="ahora" aria-controls="vAhora" aria-selected="true">Lo que toca</button>
      <button type="button" role="tab" id="tabMes" data-v="mes" aria-controls="vMes" aria-selected="false" tabindex="-1">El mes</button>
      <button type="button" role="tab" id="tabAno" data-v="ano" aria-controls="vAno" aria-selected="false" tabindex="-1">El año y KFC</button>
    </div>

    <!-- Los filtros rápidos son también el resumen: la cifra está dentro del
         botón que la filtra, así que informar y filtrar dejan de ser dos
         bloques distintos que dicen lo mismo. -->
    <div class="filtros-rapidos" id="filtros"></div>

    <section class="vista" id="vAhora" role="tabpanel" aria-labelledby="tabAhora"></section>

    <section class="vista" id="vMes" role="tabpanel" aria-labelledby="tabMes" hidden>
      <div class="barra-mes">
        <button type="button" class="btn" id="mesAnt" aria-label="Mes anterior">‹</button>
        <strong id="mesTitulo"></strong>
        <button type="button" class="btn" id="mesSig" aria-label="Mes siguiente">›</button>
        <span class="sep"></span>
        <span class="sub" id="mesResumen"></span>
      </div>
      <!-- En el celular la rejilla de siete columnas no se encoge: se cambia
           por la lista de abajo, que es la que se puede leer con una mano. -->
      <div class="calendario" id="calendario"></div>
      <p class="solo-movil sub" id="avisoMovil">En el celular el mes se lee como lista. Cambia a horizontal para ver la rejilla.</p>
      <h2 id="tituloLista">Ingresos del mes</h2>
      <div id="listaMes"></div>
    </section>

    <section class="vista" id="vAno" role="tabpanel" aria-labelledby="tabAno" hidden></section>

    <!-- La leyenda deja de ocupar sitio permanente: siete colores explicados
         arriba de un calendario que ya lleva la palabra escrita en cada fila
         son siete líneas que nadie vuelve a leer después del primer día. -->
    <details class="ayuda">
      <summary>¿Qué significa cada estado?</summary>
      <div class="ayuda-cuerpo" id="ayudaEstados"></div>
    </details>
  </div>
</div>

<!-- Panel de detalle de un ingreso -->
<div class="panel-fondo" id="panelFondo" hidden></div>
<aside class="panel" id="panel" hidden aria-label="Detalle del ingreso">
  <div class="panel-cab">
    <strong id="panelTitulo">Ingreso</strong>
    <button type="button" class="btn" id="panelCerrar" aria-label="Cerrar">✕</button>
  </div>
  <div class="panel-cuerpo" id="panelCuerpo"></div>
</aside>

<!-- Agendar / reagendar -->
<div class="panel-fondo" id="modalFondo" hidden></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
  <div class="panel-cab">
    <strong id="modalTitulo">Agendar ingreso</strong>
    <button type="button" class="btn" id="modalCerrar" aria-label="Cerrar">✕</button>
  </div>
  <div class="panel-cuerpo" id="modalCuerpo"></div>
</div>

<script src="ui.js"></script>
<script src="reglas.js"></script>
<script src="cronograma.js"></script>
</body>
</html>
