<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cronograma de preventivos · B.IA Soft ERP</title>
<link rel="stylesheet" href="estilo.css" />
<link rel="stylesheet" href="cronograma.css" />
</head>
<body>

<!-- La barra de la aplicación.
     Esta pantalla es HTML estático —la sirve el trabajador de servicio para que
     funcione sin señal— así que no puede llamar a `Ui::cabecera()` como las
     demás. La barra va con las mismas clases, y los módulos, el nombre y el
     rol los rellena `cronograma.js` con lo que devuelve el servidor
     (`Ui::modulos()`, TR-12): los mismos que ve en cualquier otra pantalla.
     Lo escrito aquí es solo lo que se ve mientras carga. -->
<header class="app-barra">
  <div class="app-barra-fila">
    <a class="app-marca" href="panel.php"><span class="punto"></span>B.IA <span class="fino">Soft ERP</span></a>
    <span class="app-espacio"></span>
    <div class="app-yo">
      <span class="nom" id="barraNombre"></span>
      <span class="chip" id="barraRol" hidden></span>
      <span class="chip" id="barraAlcance"></span>
      <a class="btn sm" href="salir.php">Salir</a>
    </div>
  </div>
  <nav class="app-nav" aria-label="Módulos">
    <div class="app-nav-fila" id="barraNav">
      <a href="panel.php">Inicio</a>
      <a href="cronograma.html" class="on" aria-current="page">Preventivos</a>
    </div>
  </nav>
</header>

<!-- La franja de alertas. Fija arriba, delgada, sin botón de cerrar:
     desaparece sola cuando la condición se resuelve, no cuando alguien la
     descarta. Es lo que pidió el cliente: visible siempre, sin estorbar. -->
<div class="alertas" id="alertas" hidden></div>

<div class="wrap">
  <div class="card">
    <div class="cab">
      <div>
        <h1>Cronograma de preventivos</h1>
        <p class="sub" id="subcab">4 ingresos al año por local, acordados con Grupo KFC</p>
      </div>
      <!-- ANTES esto era un simulador: un desplegable con los cuatro roles para
           poder probar la pantalla sin sesión. Se quedó puesto, y ahora
           contradice al servidor — `cronograma.php` filtra por la zona de la
           sesión, así que un jefe de LARB que eligiera «las 3 zonas» veía
           igual solo LARB y no entendía por qué.

           Ahora es un filtro de verdad, y lo rellena `cronograma.js` con lo
           que el servidor dice que este usuario alcanza: para la
           administración, las tres zonas y cada una por separado; para un jefe
           de zona, su zona y nada más. -->
      <div class="cab-controles">
        <label class="oculto-visual" for="usuario">Zona que se muestra</label>
        <select id="usuario"></select>
      </div>
    </div>

    <!-- Resumen de cumplimiento. Va arriba porque es lo que se mira primero. -->
    <div class="tiles" id="tiles"></div>

    <div class="barra-mes">
      <button type="button" class="btn" id="mesAnt" aria-label="Mes anterior">‹</button>
      <strong id="mesTitulo"></strong>
      <button type="button" class="btn" id="mesSig" aria-label="Mes siguiente">›</button>
      <span class="sep"></span>
      <button type="button" class="btn primary" id="btnAgendar">+ Agendar un local</button>
    </div>

    <div class="leyenda">
      <span><i class="pt vencido"></i>Vencido</span>
      <span><i class="pt poriniciar"></i>Inicia en ≤3 días</span>
      <span><i class="pt encurso"></i>En curso</span>
      <span><i class="pt planificado"></i>Planificado</span>
      <span><i class="pt cumplido"></i>Cumplido</span>
      <span><i class="pt sinagendar"></i>Sin agendar</span>
      <span><i class="pt sinkit"></i>Sin kit</span>
    </div>

    <div class="calendario" id="calendario"></div>

    <h2>Ingresos del mes</h2>
    <div id="listaMes"></div>
  </div>
</div>

<!-- Panel de detalle de un ingreso -->
<div class="panel-fondo" id="panelFondo" hidden></div>
<aside class="panel" id="panel" hidden aria-label="Detalle del ingreso">
  <div class="panel-cab">
    <strong id="panelTitulo">Ingreso</strong>
    <button type="button" class="btn" id="panelCerrar" aria-label="Cerrar">✕</button>
  </div>
  <div class="panel-cuerpo" id="panelCuerpo"></div>
</aside>

<!-- Agendar / reagendar -->
<div class="panel-fondo" id="modalFondo" hidden></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
  <div class="panel-cab">
    <strong id="modalTitulo">Agendar ingreso</strong>
    <button type="button" class="btn" id="modalCerrar" aria-label="Cerrar">✕</button>
  </div>
  <div class="panel-cuerpo" id="modalCuerpo"></div>
</div>

<script src="ui.js"></script>
<script src="reglas.js"></script>
<script src="cronograma.js"></script>
</body>
</html>
